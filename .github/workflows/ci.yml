name: RaceDay CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' # Change to '9.0' if you are using .NET 9

    # This debug step will print the exact path of your solution file in the logs
    - name: Find Solution File (Debug)
      run: find . -name "*.sln"

    - name: Restore, Build and Test
      run: |
        dotnet restore
        dotnet build --no-restore --configuration Release
        dotnet test --no-build --verbosity normal
